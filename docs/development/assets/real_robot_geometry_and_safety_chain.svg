<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">真机障碍物感知与 CBF 安全控制链</title>
  <desc id="desc">视觉支路将 Orbbec RGB-D 的杯子转为 base frame obstacle cloud；控制支路先经过 shaper、tracker 和 load support，再与 obstacle cloud 在 CBF QP 汇合，最终经关节限位送到硬件。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#334155"/></marker>
    <style>.title{font:700 29px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#0f172a}.label{font:700 18px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#0f172a}.small{font:400 14px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#334155}.note{font:400 16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#475569}.box{stroke-width:2;rx:16;ry:16}.dash{stroke-dasharray:8 7}</style>
  </defs>
  <rect width="1600" height="700" fill="#f8fafc"/>
  <text x="55" y="55" class="title">真机：视觉支路提供可信 obstacle cloud；控制支路形成完整 nominal candidate 后再由 CBF 检查</text>
  <text x="55" y="95" class="note">视觉支路（只提供 CBF 几何输入，不进入 policy）</text>
  <rect x="50" y="120" width="145" height="98" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="122" y="158" text-anchor="middle" class="label">Orbbec RGB-D</text><text x="122" y="184" text-anchor="middle" class="small">RGB + aligned depth</text>
  <line x1="195" y1="169" x2="215" y2="169" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="225" y="120" width="170" height="98" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="310" y="158" text-anchor="middle" class="label">YOLO cup detection</text><text x="310" y="184" text-anchor="middle" class="small">MobileSAM mask</text>
  <line x1="395" y1="169" x2="415" y2="169" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="425" y="120" width="170" height="98" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="510" y="158" text-anchor="middle" class="label">mask + depth</text><text x="510" y="184" text-anchor="middle" class="small">camera-frame 3D points</text>
  <line x1="595" y1="169" x2="615" y2="169" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="625" y="120" width="145" height="98" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="697" y="158" text-anchor="middle" class="label">hand-eye</text><text x="697" y="184" text-anchor="middle" class="small">camera → base</text>
  <line x1="770" y1="169" x2="790" y2="169" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="800" y="105" width="255" height="128" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="927" y="142" text-anchor="middle" class="label">过滤与体素化</text><text x="927" y="168" text-anchor="middle" class="small">workspace crop / table filter</text><text x="927" y="192" text-anchor="middle" class="small">capsule self / wrist / thin filter</text><text x="927" y="216" text-anchor="middle" class="small">voxel persistence</text>
  <line x1="1055" y1="169" x2="1075" y2="169" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1085" y="105" width="230" height="128" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1200" y="142" text-anchor="middle" class="label">obstacle cloud</text><text x="1200" y="168" text-anchor="middle" class="small">base frame / freshness</text><text x="1200" y="192" text-anchor="middle" class="small">readiness / min points</text><text x="1200" y="216" text-anchor="middle" class="small">当前 obstacle velocity = 0</text>
  <text x="55" y="300" class="note">控制支路（所有会显著改变 target 的模块先完成，再交给 obstacle CBF）</text>
  <rect x="40" y="325" width="150" height="112" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="115" y="365" text-anchor="middle" class="label">policy / PPO</text><text x="115" y="392" text-anchor="middle" class="small">raw task action</text><text x="115" y="416" text-anchor="middle" class="small">当前无 real waypoint</text>
  <line x1="190" y1="381" x2="210" y2="381" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="220" y="325" width="165" height="112" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="302" y="365" text-anchor="middle" class="label">action shaper</text><text x="302" y="392" text-anchor="middle" class="small">filter / nominal target</text><text x="302" y="416" text-anchor="middle" class="small">形成初始候选</text>
  <line x1="385" y1="381" x2="405" y2="381" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="415" y="325" width="180" height="112" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="505" y="365" text-anchor="middle" class="label">bounded tracker</text><text x="505" y="392" text-anchor="middle" class="small">policy target tracker</text><text x="505" y="416" text-anchor="middle" class="small">当前 preset 已启用</text>
  <line x1="595" y1="381" x2="615" y2="381" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="625" y="325" width="170" height="112" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="710" y="365" text-anchor="middle" class="label">load support</text><text x="710" y="392" text-anchor="middle" class="small">pre-CBF gravity bias</text><text x="710" y="416" text-anchor="middle" class="small">当前 preset 已启用</text>
  <line x1="795" y1="381" x2="815" y2="381" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="825" y="325" width="155" height="112" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="902" y="365" text-anchor="middle" class="label">q_nominal</text><text x="902" y="392" text-anchor="middle" class="small">dq_nominal =</text><text x="902" y="416" text-anchor="middle" class="small">q_nominal − q</text>
  <line x1="980" y1="381" x2="1000" y2="381" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1010" y="310" width="220" height="145" class="box" fill="#fce7f3" stroke="#db2777"/>
  <text x="1120" y="350" text-anchor="middle" class="label">obstacle CBF + QP</text><text x="1120" y="378" text-anchor="middle" class="small">q_nominal / dq_nominal</text><text x="1120" y="403" text-anchor="middle" class="small">与 obstacle cloud 汇合</text><text x="1120" y="430" text-anchor="middle" class="small">得到 CBF correction</text>
  <path d="M1200,233 L1200,275 L1120,275 L1120,310" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1230" y1="381" x2="1250" y2="381" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1260" y="325" width="160" height="112" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1340" y="365" text-anchor="middle" class="label">joint-limit safety</text><text x="1340" y="392" text-anchor="middle" class="small">只收紧</text><text x="1340" y="416" text-anchor="middle" class="small">不放大 CBF-safe step</text>
  <line x1="1420" y1="381" x2="1440" y2="381" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1450" y="325" width="120" height="112" class="box" fill="#fce7f3" stroke="#db2777"/>
  <text x="1510" y="360" text-anchor="middle" class="label">q_cmd_final</text><text x="1510" y="386" text-anchor="middle" class="small">hardware</text><text x="1510" y="410" text-anchor="middle" class="small">controller → robot</text>
  <rect x="60" y="510" width="700" height="78" class="box dash" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="410" y="542" text-anchor="middle" class="label">当前 static cup cloud：lock_static_target_cloud = false</text><text x="410" y="568" text-anchor="middle" class="small">新鲜、有效的视觉输入到来时持续更新，而不是永久锁定第一帧</text>
  <rect x="820" y="510" width="720" height="78" class="box dash" fill="#fff7ed" stroke="#ea580c"/>
  <text x="1180" y="542" text-anchor="middle" class="label">当前未接入真机主链</text><text x="1180" y="568" text-anchor="middle" class="small">WaypointManager；dual-arm CBF；obstacle_motion_observer；velocity-aware dynamic CBF</text>
  <text x="800" y="650" text-anchor="middle" class="note">诊断顺序：depth → point cloud → base frame → filters → obstacle cloud → clearance / h_min → freshness → readiness。</text>
</svg>
