<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">SDF-CBF-QP 共享核心单步控制链</title>
  <desc id="desc">共享 CBF 核心抽象：policy 给出 nominal action，几何 barrier 形成约束，QP 求安全 correction。图中不展开 simulation runtime 和真机命令链。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#334155"/></marker>
    <style>.title{font:700 30px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#0f172a}.label{font:700 22px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#0f172a}.small{font:400 17px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#334155}.note{font:400 18px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#475569}.box{stroke-width:2;rx:18;ry:18}.dash{stroke-dasharray:9 8}</style>
  </defs>
  <rect width="1600" height="500" fill="#f8fafc"/>
  <text x="70" y="62" class="title">SDF-CBF-QP：共享 CBF 核心只负责把危险动作改成安全动作</text>
  <rect x="70" y="92" width="1460" height="48" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="800" y="123" text-anchor="middle" class="note">共享 CBF 核心抽象，不代表完整 simulation runtime 或 real command path</text>
  <rect x="70" y="190" width="225" height="115" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="182" y="235" text-anchor="middle" class="label">policy / PPO</text><text x="182" y="265" text-anchor="middle" class="small">根据状态与目标</text><text x="182" y="289" text-anchor="middle" class="small">提出原始关节动作</text>
  <line x1="295" y1="247" x2="365" y2="247" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="375" y="190" width="245" height="115" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="497" y="235" text-anchor="middle" class="label">nominal action</text><text x="497" y="265" text-anchor="middle" class="small">不考虑障碍物的</text><text x="497" y="289" text-anchor="middle" class="small">候选动作</text>
  <line x1="620" y1="247" x2="690" y2="247" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="700" y="170" width="270" height="155" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="835" y="216" text-anchor="middle" class="label">SDF + capsule</text><text x="835" y="246" text-anchor="middle" class="small">由当前 q 与障碍物</text><text x="835" y="272" text-anchor="middle" class="small">计算 clearance、h_min</text><text x="835" y="298" text-anchor="middle" class="small">形成 CBF 线性约束</text>
  <line x1="970" y1="247" x2="1040" y2="247" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1050" y="190" width="210" height="115" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1155" y="235" text-anchor="middle" class="label">QP correction</text><text x="1155" y="265" text-anchor="middle" class="small">满足安全约束</text><text x="1155" y="289" text-anchor="middle" class="small">并最小化修正</text>
  <line x1="1260" y1="247" x2="1330" y2="247" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1340" y="190" width="190" height="115" class="box" fill="#fce7f3" stroke="#db2777"/>
  <text x="1435" y="235" text-anchor="middle" class="label">safe action</text><text x="1435" y="265" text-anchor="middle" class="small">nominal +</text><text x="1435" y="289" text-anchor="middle" class="small">CBF correction</text>
  <rect x="70" y="365" width="690" height="80" class="box dash" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="415" y="397" text-anchor="middle" class="label">simulation runtime 的可选外围阶段</text><text x="415" y="425" text-anchor="middle" class="small">target_guidance / WaypointManager；correction filter；unsafe bypass</text>
  <rect x="840" y="365" width="690" height="80" class="box dash" fill="#fff7ed" stroke="#ea580c"/>
  <text x="1185" y="397" text-anchor="middle" class="label">real command path 的额外阶段</text><text x="1185" y="425" text-anchor="middle" class="small">policy target tracker；load support；joint-limit safety；hardware controller</text>
  <text x="800" y="480" text-anchor="middle" class="note">CBF 不决定“从哪边绕”，只保证当前小步不继续把机器人推向危险区域。</text>
</svg>
